<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Celeste 🩵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="heart-canvas"></canvas>

<main class="wrapper">
  <div class="content-box" id="questionBox">
    <h1 class="title" id="mainTitle">Sabes que te quiero mucho? 🩵</h1>
    <p class="subtitle">Tengo algo por preguntarte</p>
    <div class="button-container">
      <button class="btn btn-yes" id="yesBtn">Sí, por supuesto que sí</button>
      <button class="btn btn-no button-rosa" id="noBtn">Sí pero en gris</button>
    </div>
  </div>

  <div class="content-box result-box" id="resultBox" style="display: none;">
    <div class="love-text">Te adoro, Celes 🩵</div>
    <canvas id="heart-canvas"></canvas>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
