<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Celeste 🩵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- === LOADING SCREEN === -->
<div id="loading-screen" class="loading-screen">
  <div class="loading-heart">💖</div>
  <p class="loading-text">Cargando amor...</p>
  <div class="loading-bar"><div class="loading-fill"></div></div>
</div>

<!-- === THEME TOGGLE === -->
<button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema" title="Cambiar modo día/noche">
  <span class="toggle-icon-sun">☀️</span>
  <span class="toggle-icon-moon">🌙</span>
</button>

<canvas id="hearts"></canvas>
<canvas id="stardust"></canvas>

<main class="wrapper">
  <div class="content-box" id="questionBox">
    <div class="ribbon">🎀</div>
    <span class="badge">Para la mejor chica del mundo 🩵</span>
    <h1 class="title" id="mainTitle">Sabes que eres la mejor ¿no? 🩵</h1>
    <p class="subtitle">Espero que te guste 🩵</p>
    <div class="btn-row">
      <button class="btn btn-yes" id="yesBtn">¡Obvio! 🩵</button>
      <button class="btn btn-no" id="noBtn">Nop 🫣</button>
    </div>
  </div>

  <div class="content-box result-box" id="resultBox" style="display: none;">
    <div class="polaroid">
      <img src="cat.gif" alt="Gato con corazones" class="cat-gif">
      <div class="polaroid-caption">TE AMOOOOO 🩵💖✨</div>
    </div>
    <h2 class="result-title">Te adoro, Celes 🩵</h2>
    <p class="result-text">Gracias por estar siempre Celes 🩵</p>

    <!-- Sección de cartas interactivas -->
    <div class="letters-section">
      <p class="letters-intro">MIRAAAAAA</p>
      
      <div class="letters-grid">
        <!-- Carta 1 -->
        <div class="letter-card" data-letter="1">
          <div class="letter-cover">
            <span class="letter-emoji">✉️</span>
            <span class="letter-title">I</span>
            <span class="letter-seal">🩵</span>
          </div>
        </div>

        <!-- Carta 2 -->
        <div class="letter-card" data-letter="2">
          <div class="letter-cover">
            <span class="letter-emoji">✉️</span>
            <span class="letter-title">LOVE</span>
            <span class="letter-seal">💖</span>
          </div>
        </div>

        <!-- Carta 3 -->
        <div class="letter-card" data-letter="3">
          <div class="letter-cover">
            <span class="letter-emoji">✉️</span>
            <span class="letter-title">YOU</span>
            <span class="letter-seal">⭐</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Modales para las cartas -->
<div class="letter-modal" id="modal1">
  <div class="letter-paper">
    <span class="close-btn">&times;</span>
    <h3>I 🩵</h3>
    <div class="letter-text" id="letterText1"></div>
    <p class="letter-signature">— carlitos</p>
  </div>
</div>

<div class="letter-modal" id="modal2">
  <div class="letter-paper">
    <span class="close-btn">&times;</span>
    <h3>LOVE 🌧️</h3>
    <div class="letter-text" id="letterText2"></div>
    <p class="letter-signature">— carlitos</p>
  </div>
</div>

<div class="letter-modal" id="modal3">
  <div class="letter-paper">
    <span class="close-btn">&times;</span>
    <h3>YOU ✨</h3>
    <div class="letter-text" id="letterText3"></div>
    <p class="letter-signature">— carlitos</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
