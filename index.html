<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Me amas? 💙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="hearts"></canvas>

<div class="page">
  <div class="card" id="card">
    <div class="glow"></div>
    <div class="content">
      <p class="eyebrow">Para ti 💙</p>
      <h1 class="question">¿Me amas?</h1>
      <p class="subtitle">Toca una respuesta... o intenta escapar.</p>

      <div class="buttons" id="buttons">
        <button class="btn btn-yes" id="yesBtn">Sí 💙</button>
        <button class="btn btn-no" id="noBtn">No ✨</button>
      </div>

      <div class="message" id="message" style="display:none;">
        <div class="heart-big">💙</div>
        <h2>Lo sabía 😍</h2>
        <p>Tu corazón también me dice que sí.</p>
        <button class="retry" id="retryBtn">Volver a preguntar 💙</button>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
